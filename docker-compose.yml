services:

  postgres:
    image: postgres:16
    container_name: spectrax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: spectrax
      POSTGRES_USER: spectrax
      POSTGRES_PASSWORD: spectrax
    ports:
      - "5432:5432"
    volumes:
      - spectrax_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectrax -d spectrax"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: spectrax-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - spectrax_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spectrax_postgres_data:
  spectrax_redis_data:
